<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 16px; font-family: system-ui; background: #0f172a; color: #e2e8f0; }
    button { width: 100%; padding: 8px; margin: 4px 0; background: #6366f1; border: none; color: white; border-radius: 6px; cursor: pointer; }
    textarea { width: 100%; height: 80px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 6px; padding: 8px; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 12px">AI Assistant</h3>
  <button id="summarize">Summarize Page</button>
  <button id="rewrite">Rewrite Selection</button>
  <textarea id="result" placeholder="Results appear here..."></textarea>
  <p style="font-size:11px; color:#94a3b8; margin-top:8px">Pro version unlocks unlimited use. Add your API key in settings.</p>
  <script src="popup.js"></script>
</body>
</html>
